name: Test and deploy CatTetris

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Check JavaScript and game rules
        run: |
          node --check engine.js
          node --check skins.js
          node --check audio.js
          node --check game.js
          node --test tests/*.test.cjs
      - name: Prepare website files
        run: |
          mkdir -p _site/assets/audio
          cp index.html style.css mobile.css engine.js skins.js audio.js game.js manifest.webmanifest _site/
          cp assets/cats-transparent.png assets/cats2-transparent.png assets/icon.svg assets/apple-touch-icon.png _site/assets/
          cp assets/audio/line-clear-meow-b.wav assets/audio/README.md _site/assets/audio/
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v5
        if: github.event_name != 'pull_request'
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
